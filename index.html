<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Support Ticket</title>
<link rel="icon" href="logo Elshinta.png">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<style>
body{
    font-family:'Segoe UI';
    margin:0;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
}
.container{
    max-width:1000px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:15px;
}
button{
    padding:8px;
    border:none;
    border-radius:6px;
    background:#2a5298;
    color:white;
    cursor:pointer;
}
input,select,textarea{
    width:100%;
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
}
table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}
th,td{
    padding:8px;
    border-bottom:1px solid #ddd;
}
.status-open{color:red;}
.status-done{color:green;}

@media (max-width:768px){
    table{display:none;}
    .card{
        background:white;
        border-radius:12px;
        padding:15px;
        margin-bottom:10px;
        box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }
    .card img{width:100%; border-radius:10px;}
}
</style>
</head>

<body>
<div class="container">

<div style="text-align:right;">
<div id="clock"></div>
<button onclick="adminLogin()">Login Admin</button>
<button onclick="logout()">Logout</button>
</div>

<div id="infoUser"></div>

<h2>IT Support Ticket</h2>

<div id="userSection">
<input id="userLogin" placeholder="Masukkan Nama / User">
<button onclick="setUser()">Masuk</button>
</div>

<div id="formSection">
<form onsubmit="createTicket(event)">
<input id="nama" placeholder="Nama Pelapor" required>

<select id="departemen" required>
<option value="">Pilih Dept</option>
<option>IT</option>
<option>Redaksi</option>
<option>Listener</option>
<option>Medsos</option>
<option>Admin</option>
<option>Website</option>
<option>Hrd/GA</option>
<option>Koordinator Daerah</option>
<option>Marketing</option>
<option>Finance</option>
<option>Semarang</option> 
<option>Surabaya</option> 
<option>Tegal</option> 
<option>Bandung</option> 
<option>Palembang</option> 
<option>Lampung</option> 
<option>Medan</option>
</select>

<textarea id="deskripsi" placeholder="Masalah" required></textarea>
<input type="file" id="foto" accept="image/*">
<textarea id="penyelesaian" placeholder="Solusi"></textarea>

<button type="submit">Buat Tiket</button>
</form>
</div>

<h3>Report Bulanan</h3>
<select id="filterBulan"></select>
<button onclick="generateReport()">Generate Report</button>
<div id="reportResult"></div>
    
<h3>Data User</h3>
<button onclick="loadUsers()">Load User</button>
<div id="userList"></div>

<h3>Daftar Tiket</h3>
<table>
<thead>
<tr>
<th>No</th><th>Nama</th><th>Dept</th><th>Deskripsi</th><th>Waktu</th><th>Foto</th><th>Solusi</th><th>Status</th><th>Aksi</th>
</tr>
</thead>
<tbody id="ticketTable"></tbody>
</table>

<div id="mobileView"></div>

</div>

<script>
const firebaseConfig = {
    apiKey: "ISI_API_KEY_LO",
    authDomain: "it-supportticket.firebaseapp.com",
    databaseURL: "https://it-supportticket-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "it-supportticket",
    storageBucket: "it-supportticket.appspot.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let isAdmin = false;
let currentUser = "";
let selectedUser = "";

/* CLOCK */
function updateClock(){
    document.getElementById("clock").innerText =
    new Date().toLocaleString("id-ID");
}
setInterval(updateClock,1000);

/* INIT BULAN */
function initBulan(){
    const select = document.getElementById("filterBulan");
    const now = new Date();

    for(let i=0;i<12;i++){
        const d = new Date(now.getFullYear(),i,1);
        const val = d.toISOString().slice(0,7);

        const opt = document.createElement("option");
        opt.value = val;
        opt.textContent = d.toLocaleString("id-ID",{month:'long',year:'numeric'});

        if(i===now.getMonth()) opt.selected = true;
        select.appendChild(opt);
    }
}

/* LOAD TICKET */
function loadTickets(){
    db.ref("tickets").on("value",snap=>{
        const table = document.getElementById("ticketTable");
        const mobile = document.getElementById("mobileView");

        table.innerHTML="";
        mobile.innerHTML="";

        let no=1;

        snap.forEach(child=>{
            const t = child.val();
            const key = child.key;

            // kalau admin lagi filter user
if(isAdmin && selectedUser && t.user !== selectedUser) return;
if(!isAdmin && t.user !== currentUser) return;

            table.innerHTML += `
<tr>
<td>${no++}</td>
<td>${t.nama}</td>
<td>${t.departemen}</td>
<td>${t.deskripsi}</td>
<td>${t.waktu||'-'}</td>
<td>${t.foto?`<img src="${t.foto}" width="60">`:''}</td>
<td>${t.penyelesaian||'-'}</td>
<td class="${t.status==='OPEN'?'status-open':'status-done'}">${t.status}</td>
<td>${isAdmin?`
<button onclick="done('${key}')">✔</button>
<button onclick="hapus('${key}')">🗑</button>`:'-'}</td>
</tr>`;

            const card = document.createElement("div");
            card.className="card";
            card.innerHTML=`
<p><b>${t.nama}</b></p>
<p>${t.departemen}</p>
<p>${t.deskripsi}</p>
<p>${t.status}</p>
${t.foto?`<img src="${t.foto}">`:''}
`;
            mobile.appendChild(card);
        });
    });
}

/* CREATE */
function createTicket(e){
e.preventDefault();

const file=document.getElementById("foto").files[0];

const dataBase=(img)=>{
    const data={
        user:currentUser,
        nama:nama.value,
        departemen:departemen.value,
        deskripsi:deskripsi.value,
        foto:img,
        penyelesaian:penyelesaian.value,
        status:penyelesaian.value?"DONE":"OPEN",
        createdAt:Date.now(),
        waktu:new Date().toLocaleString("id-ID")
    };

    db.ref("tickets").push(data);
    document.querySelector("form").reset();
};

if(file){
    const r=new FileReader();
    r.onload=()=>dataBase(r.result);
    r.readAsDataURL(file);
}else{
    dataBase("");
}
}

/* REPORT */
function generateReport(){
const bulan=document.getElementById("filterBulan").value;

db.ref("tickets").once("value",snap=>{
let total=0,open=0,done=0;

snap.forEach(c=>{
const t=c.val();
if(!t.createdAt)return;

if(new Date(t.createdAt).toISOString().slice(0,7)===bulan){
total++;
if(t.status==="OPEN")open++;
if(t.status==="DONE")done++;
}
});

document.getElementById("reportResult").innerHTML=`
<div style="margin-top:10px;padding:10px;background:#eee;">
<h4>${bulan}</h4>
<p>Total:${total}</p>
<p style="color:red;">Open:${open}</p>
<p style="color:green;">Done:${done}</p>
</div>`;
});
}

    
function loadUsers(){
    if(!isAdmin){
        alert("Khusus admin bro!");
        return;
    }

    db.ref("tickets").once("value", snap=>{
        const users = {};

        snap.forEach(child=>{
            const t = child.val();
            if(!t.user) return;

            if(!users[t.user]){
                users[t.user] = 0;
            }

            users[t.user]++;
        });

        let html = `
        <div style="background:#f5f5f5; padding:15px; border-radius:10px;">
        <h4>Daftar User</h4>
        `;

        for(let u in users){
            html += `
            <p style="cursor:pointer;" onclick="filterUser('${u}')">
                👤 <b>${u}</b> - ${users[u]} tiket
            </p>`;
        }

        html += `</div>`;
        document.getElementById("userList").innerHTML = html;
    });
}

/* FILTER USER */
function filterUser(user){
    selectedUser = user;
    loadTickets();
    onclick="filterUser('${u}')"
}

/* RESET FILTER (opsional) */
function resetFilter(){
    selectedUser = "";
    loadTickets();
}

/* ADMIN */
function adminLogin(){
const pass=prompt("Password:");
db.ref("config/adminPassword").once("value",snap=>{
if(pass===snap.val()){
isAdmin=true;
currentUser="ADMIN";
alert("Login Admin OK");
loadTickets();
}else alert("Salah password");
});
}

function setUser(){
currentUser=userLogin.value;
infoUser.innerText="Login: "+currentUser;
loadTickets();
}

function logout(){location.reload();}

function done(key){
const sol=prompt("Solusi:");
db.ref("tickets/"+key).update({status:"DONE",penyelesaian:sol});
}

function hapus(key){
if(confirm("Hapus?")) db.ref("tickets/"+key).remove();
}

/* INIT */
window.onload=()=>{
initBulan();
loadTickets();
updateClock();
};
</script>

</body>
</html>
